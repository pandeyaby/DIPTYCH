name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest + PoC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Package is stdlib-only; PYTHONPATH=. is enough to import diptych.

      - name: pytest
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: PoC (full-8 gate)
        run: ./scripts/run_poc.sh
        # Fail the job on any non-zero exit (default shell behavior).
