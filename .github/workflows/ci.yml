name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest + PoC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (editable) + pytest
        run: |
          python -m pip install --upgrade pip
          # Stranger path: pip install -e . (stdlib-only runtime; pytest via [dev]).
          pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -q

      - name: PoC (full-8 gate)
        run: ./scripts/run_poc.sh
        # Fail the job on any non-zero exit (default shell behavior).

      - name: Artifact pack dry-run
        run: |
          make artifact
          test -n "$(ls dist/DIPTYCH-*.zip dist/DIPTYCH-*.tar.gz 2>/dev/null | head -1)"
          ls -la dist/DIPTYCH-*

  paper-pdf:
    name: Build paper PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live (IEEEtran + latexmk + BibTeX)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-publishers \
            texlive-science \
            latexmk \
            lmodern

      - name: Build PDF (fail on compile errors)
        # Named author block only. Anonymization is a local/pre-upload dry-run
        # (paper/ANON.md); do not fail CI on anon PDF absence.
        working-directory: paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error one-trace-is-not-enough.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-trace-is-not-enough-pdf
          path: paper/one-trace-is-not-enough.pdf
          if-no-files-found: error
