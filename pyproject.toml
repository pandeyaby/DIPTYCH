[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diptych"
version = "0.2.0"
description = "DIPTYCH — paired-trace hyperproperty grading harness (IEEE artifact)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DIPTYCH authors" }]
keywords = ["hyperproperty", "grading", "harness", "diptych_schema"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
# Stdlib-only runtime; pytest is optional for local/CI parity.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

# Stranger CLIs after: pip install -e ".[dev]"  (python -m diptych* still works)
[project.scripts]
diptych = "diptych.smoke:main"
diptych-poc = "diptych.poc:main"
diptych-full8 = "diptych.run_full8:main"
diptych-grade = "diptych.grade:main"
diptych-matrix = "diptych.matrix:main"
diptych-schema = "diptych.schema:main"
diptych-pins = "diptych.pins:main"

[project.urls]
Homepage = "https://github.com/pandeyaby/DIPTYCH"
Repository = "https://github.com/pandeyaby/DIPTYCH"

[tool.setuptools.packages.find]
include = ["diptych*"]

[tool.setuptools.package-data]
diptych = ["py.typed", "schema/v0_2.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
