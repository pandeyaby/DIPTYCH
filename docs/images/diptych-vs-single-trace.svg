<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="One film versus coupled diptych">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0f172a"/>
    </marker>
    <style type="text/css"><![CDATA[
      .title { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; font-size: 16px; fill: #334155; }
      .h { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; }
      .body { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; font-size: 16px; fill: #334155; }
      .small { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; font-size: 14px; fill: #475569; }
      .tick { font-family: DejaVu Sans, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #9a3412; }
    ]]></style>
  </defs>

  <rect width="1400" height="720" fill="#f1f5f9"/>
  <text x="48" y="52" class="title">One film vs. the diptych</text>
  <text x="48" y="82" class="sub">Single-trace demos can look legal; calibration is graded only on a coupled pair + axis power.</text>

  <!-- Left panel: single trace -->
  <rect x="48" y="110" width="620" height="560" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="48" y="110" width="620" height="52" rx="8" fill="#fff7ed" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="48" y="140" width="620" height="22" fill="#fff7ed"/>
  <text x="72" y="144" class="h" fill="#9a3412">Single trace (insufficient)</text>

  <!-- timeline ticks -->
  <g>
    <rect x="100" y="220" width="80" height="110" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
    <text x="126" y="285" class="tick">t0</text>
    <rect x="200" y="220" width="80" height="110" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
    <text x="226" y="285" class="tick">t1</text>
    <rect x="300" y="220" width="80" height="110" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
    <text x="326" y="285" class="tick">t2</text>
    <rect x="400" y="220" width="80" height="110" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
    <text x="426" y="285" class="tick">t3</text>
    <rect x="500" y="220" width="80" height="110" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/>
    <text x="524" y="285" class="tick">tn</text>
  </g>
  <line x1="100" y1="370" x2="580" y2="370" stroke="#c2410c" stroke-width="3.5"/>

  <text x="100" y="420" class="body">One execution / one seed / one cassette</text>
  <text x="100" y="450" class="body">Local invariants may hold on that film alone.</text>

  <rect x="100" y="490" width="500" height="120" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="130" y="540" class="h" fill="#9a3412">Looks legal  ≠  calibrated</text>
  <text x="130" y="575" class="small">No counterfactual twin → no 2-safety evidence</text>

  <!-- Right panel: diptych -->
  <rect x="732" y="110" width="620" height="560" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="732" y="110" width="620" height="52" rx="8" fill="#ecfeff" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="732" y="140" width="620" height="22" fill="#ecfeff"/>
  <text x="756" y="144" class="h" fill="#0e7490">Coupled pair (DIPTYCH)</text>

  <rect x="772" y="200" width="540" height="72" rx="6" fill="#e0f2fe" stroke="#0e7490" stroke-width="2.5"/>
  <text x="800" y="245" class="body" fill="#0e7490">Shared prefix (open-loop shape / CRN point)</text>

  <rect x="772" y="300" width="230" height="130" rx="6" fill="#ecfdf5" stroke="#15803d" stroke-width="2.5"/>
  <text x="830" y="355" class="h" fill="#15803d">Trace A</text>
  <text x="800" y="390" class="small">conforming → pass</text>

  <rect x="1052" y="300" width="230" height="130" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="1110" y="355" class="h" fill="#b91c1c">Trace B</text>
  <text x="1085" y="390" class="small">violating → fail</text>

  <line x1="1002" y1="365" x2="1052" y2="365" stroke="#0f172a" stroke-width="3" marker-end="url(#arr)"/>
  <text x="980" y="460" class="small" fill="#0f172a">one controlled axis</text>

  <rect x="772" y="500" width="540" height="120" rx="6" fill="#ecfdf5" stroke="#15803d" stroke-width="2.5"/>
  <text x="800" y="550" class="h" fill="#15803d">Only the pair = calibrated</text>
  <text x="800" y="585" class="small">+ gate_axis_mutate (axis fingerprint must flip pass→fail)</text>
</svg>
